spring:
  datasource:
    url: jdbc:mysql://localhost:3306/quora_db
    password: root
    username: root
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
      dialect: org.hibernate.dialect.MySQL8Dialect
  flyway:
    baseline-on-migrate: true
    enabled: true

  data:
    redis:
      host: localhost
      port: 6379
      password: redis123
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  
logging:
  level:
    "[com.quora]": DEBUG
    "[org.hibernate.sql]": DEBUG

springdoc:
  swagger-ui:
    csrf:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        

app:
  jwt:
    secret: "mySuperSecretKeyForJWTGenerationShouldBeAtLeast32CharsLong"
    access-expiration-ms: 900000                 # 15 min
    refresh-expiration-ms: 604800000             # 7 days
  cookie:
    secure: false                                # true in production (HTTPS only)
    domain: localhost                            # your domain in prod
    same-site: Strict                            # CSRF protection
