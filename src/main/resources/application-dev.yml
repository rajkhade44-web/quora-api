spring:
  datasource:
    url: jdbc:mysql://localhost:3306/quora_db
    password: root
    username: root
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
      dialect: org.hibernate.dialect.MySQL8Dialect
  flyway:
    baseline-on-migrate: true
    enabled: true
logging:
  level:
    "[com.quora]": DEBUG
    "[org.hibernate.sql]": DEBUG

springdoc:
  swagger-ui:
    csrf:
      enabled: true

app:
  jwt:
    secret: "mySuperSecretKeyForJWTGenerationShouldBeAtLeast32CharsLong"
    access-expiration-ms: 900000                 # 15 min
    refresh-expiration-ms: 604800000             # 7 days
  cookie:
    secure: false                                # true in production (HTTPS only)
    domain: localhost                            # your domain in prod
    same-site: Strict                            # CSRF protection
