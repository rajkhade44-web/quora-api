spring:
  datasource:
    url: jdbc:mysql://localhost:3306/qoura_db
    password: root
    username: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true
logging:
    level:
        '[com.quora]': DEBUG
        '[org.hibernate.sql]': DEBUG

springdoc:
  swagger-ui:
    csrf:
      enabled: true
