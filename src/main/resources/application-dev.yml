spring:
  datasource:
    url: jdbc:mysql://localhost:3306/quora_db
    password: root
    username: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
      dialect: org.hibernate.dialect.MySQL8Dialect
logging:
  level:
    "[com.quora]": DEBUG
    "[org.hibernate.sql]": DEBUG

springdoc:
  swagger-ui:
    csrf:
      enabled: true
